<svg width="300" height="160" viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #c9d1d9; }
    .title { font-weight: 600; font-size: 14px; fill: #58a6ff; }
    .val { font-weight: 600; fill: #c9d1d9; text-anchor: end; }
  </style>
  <!-- Fundo do GitHub Dark (sem bordas) -->
  <rect width="100%" height="100%" rx="6" fill="#0d1117"/>
  <!-- Título -->
  <text x="20" y="30" class="title">GitHub Stats</text>
  <g transform="translate(0, 60)">    <text x="20" y="0">Total Stars</text>    <text x="280" y="0" class="val">2</text>  </g>
  <g transform="translate(0, 82)">    <text x="20" y="0">Total Commits</text>    <text x="280" y="0" class="val">760</text>  </g>
  <g transform="translate(0, 104)">    <text x="20" y="0">Total Issues</text>    <text x="280" y="0" class="val">13</text>  </g>
  <g transform="translate(0, 126)">    <text x="20" y="0">TotalPull Requests</text>    <text x="280" y="0" class="val">106</text>  </g>
  <g transform="translate(0, 148)">    <text x="20" y="0">Total Contributions</text>    <text x="280" y="0" class="val">886</text>  </g>
</svg>