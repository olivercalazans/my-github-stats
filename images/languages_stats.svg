<svg width="300" height="160" viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #c9d1d9; }
    .title { font-weight: 600; font-size: 14px; fill: #58a6ff; }
  </style>
  <!-- Fundo do GitHub Dark (sem bordas) -->
  <rect width="100%" height="100%" rx="6" fill="#0d1117"/>
  <!-- Título -->
  <text x="20" y="30" class="title">Most Used Languages</text>
  <!-- Barra de Progresso Segmentada -->
  <svg x="20" y="50" width="260" height="10">
    <mask id="bar-mask"><rect width="260" height="10" rx="5" fill="#fff"/></mask>
    <g mask="url(#bar-mask)">
    <rect x="0" y="0" width="148.64645495083315" height="10" fill="#00ADD8" rx="2" ry="2"/>
    <rect x="148.64645495083315" y="0" width="77.18568953559816" height="10" fill="#3572A5" rx="2" ry="2"/>
    <rect x="225.8321444864313" y="0" width="23.996687929665978" height="10" fill="#3D6117" rx="2" ry="2"/>
    <rect x="249.82883241609727" y="0" width="7.745445244041042" height="10" fill="#012456" rx="2" ry="2"/>
    <rect x="257.5742776601383" y="0" width="2.425722339861663" height="10" fill="#89e051" rx="2" ry="2"/>
    </g>
  </svg>
  <g transform="translate(20, 85)">    <circle cx="4" cy="4" r="4" fill="#00ADD8"/>    <text x="14" y="8">Go (57.2%)</text>  </g>
  <g transform="translate(150, 85)">    <circle cx="4" cy="4" r="4" fill="#3572A5"/>    <text x="14" y="8">Python (29.7%)</text>  </g>
  <g transform="translate(20, 105)">    <circle cx="4" cy="4" r="4" fill="#3D6117"/>    <text x="14" y="8">TeX (9.2%)</text>  </g>
  <g transform="translate(150, 105)">    <circle cx="4" cy="4" r="4" fill="#012456"/>    <text x="14" y="8">PowerShell (3.0%)</text>  </g>
  <g transform="translate(20, 125)">    <circle cx="4" cy="4" r="4" fill="#89e051"/>    <text x="14" y="8">Shell (0.9%)</text>  </g>
</svg>