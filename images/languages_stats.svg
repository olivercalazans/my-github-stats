<svg width="300" height="160" viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #c9d1d9; }
    .title { font-weight: 600; font-size: 14px; fill: #58a6ff; }
  </style>
  <!-- Fundo do GitHub Dark (sem bordas) -->
  <rect width="100%" height="100%" rx="6" fill="#0d1117"/>
  <!-- Título -->
  <text x="20" y="30" class="title">Most Used Languages</text>
  <!-- Barra de Progresso Segmentada -->
  <svg x="20" y="50" width="260" height="10">
    <mask id="bar-mask"><rect width="260" height="10" rx="5" fill="#fff"/></mask>
    <g mask="url(#bar-mask)">
    <rect x="0" y="0" width="184.4751227317195" height="10" fill="#00ADD8" rx="2" ry="2"/>
    <rect x="184.4751227317195" y="0" width="46.6506664170806" height="10" fill="#3572A5" rx="2" ry="2"/>
    <rect x="231.1257891488001" y="0" width="20.2788678597772" height="10" fill="#3D6117" rx="2" ry="2"/>
    <rect x="251.4046570085773" y="0" width="6.545439148911514" height="10" fill="#012456" rx="2" ry="2"/>
    <rect x="257.9500961574888" y="0" width="2.0499038425111924" height="10" fill="#89e051" rx="2" ry="2"/>
    </g>
  </svg>
  <g transform="translate(20, 85)">    <circle cx="4" cy="4" r="4" fill="#00ADD8"/>    <text x="14" y="8">Go (71.0%)</text>  </g>
  <g transform="translate(150, 85)">    <circle cx="4" cy="4" r="4" fill="#3572A5"/>    <text x="14" y="8">Python (17.9%)</text>  </g>
  <g transform="translate(20, 105)">    <circle cx="4" cy="4" r="4" fill="#3D6117"/>    <text x="14" y="8">TeX (7.8%)</text>  </g>
  <g transform="translate(150, 105)">    <circle cx="4" cy="4" r="4" fill="#012456"/>    <text x="14" y="8">PowerShell (2.5%)</text>  </g>
  <g transform="translate(20, 125)">    <circle cx="4" cy="4" r="4" fill="#89e051"/>    <text x="14" y="8">Shell (0.8%)</text>  </g>
</svg>